<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProcessFoundry AI — Interactive Prototype</title>
<style>
:root{--ink:#15243a;--muted:#64748b;--line:#e5eaf1;--bg:#f5f7fb;--navy:#101f36;--blue:#3568f5;--blue2:#eaf0ff;--teal:#0d9b8a;--orange:#f59e0b;--red:#d9485f;--white:#fff;--shadow:0 16px 45px rgba(23,42,77,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:#d6deec;padding:26px 18px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px;color:white;font-weight:750;font-size:17px;letter-spacing:-.3px}.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5b8cff,#5ad2c0);display:grid;place-items:center;color:#102039;font-weight:900;font-size:18px}.brand small{display:block;color:#8291aa;font-size:10px;font-weight:600;letter-spacing:1.5px;margin-top:2px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#8291aa;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;color:#aebbd0;background:transparent;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:#223550;color:#fff}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;border-top:1px solid #2a3a52;padding:17px 9px 0;color:#8291aa;font-size:12px}.statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#50d5b2;margin-right:7px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{color:#8090a6;font-size:12px}.topright{display:flex;align-items:center;gap:18px}.searchmini{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:#91a0b3;background:#fbfcfe;width:190px}.avatar{width:36px;height:36px;border-radius:50%;background:#dce7ff;color:#3158be;display:grid;place-items:center;font-weight:750}.userline{display:flex;align-items:center;gap:10px}.userline b{display:block;font-size:12px}.userline small{display:block;color:var(--muted);font-size:11px}.content{padding:32px 36px 48px;max-width:1450px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);font-weight:800}.headingrow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.headingrow h1{font-size:29px;letter-spacing:-.9px;margin:6px 0 7px}.sub{color:var(--muted);margin:0}.btn{padding:10px 15px;border-radius:9px;font-weight:700;transition:.15s}.btn-primary{background:var(--blue);color:white;box-shadow:0 5px 14px #3568f526}.btn-primary:hover{background:#2455df;transform:translateY(-1px)}.btn-secondary{background:white;border:1px solid var(--line);color:#34445b}.btn-quiet{background:transparent;color:var(--muted);padding:8px}.btn-small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 2px 7px #10203904}.statlabel{color:var(--muted);font-size:12px}.statnum{font-size:27px;font-weight:760;letter-spacing:-.7px;margin:8px 0 4px}.statnote{font-size:11px;color:#718096}.staticon{float:right;width:35px;height:35px;border-radius:10px;background:#edf2ff;display:grid;place-items:center;font-size:16px}.cols{grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr)}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cardhead h3{margin:0;font-size:15px}.muted{color:var(--muted)}.projectrow{display:flex;align-items:center;gap:13px;padding:15px 0;border-top:1px solid #edf0f5}.projectrow:first-of-type{border-top:0}.projecticon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#edf2ff;color:#4166d8;font-weight:800}.projectinfo{flex:1;min-width:0}.projectinfo b{display:block;font-size:13px}.projectinfo small{display:block;color:var(--muted);margin-top:4px}.pill{font-size:10px;padding:5px 8px;border-radius:99px;font-weight:750;white-space:nowrap}.pill-blue{background:#edf2ff;color:#355ed6}.pill-green{background:#e2f8f1;color:#137c67}.pill-amber{background:#fff4d9;color:#96650b}.pill-gray{background:#eef1f5;color:#637188}.activity{display:grid;gap:17px}.activityitem{display:flex;gap:11px}.activitydot{width:30px;height:30px;border-radius:9px;background:#eff4ff;display:grid;place-items:center;flex-shrink:0}.activityitem b{display:block;font-size:12px}.activityitem small{color:var(--muted);font-size:11px}.invitecard{background:linear-gradient(120deg,#eaf0ff,#effbf9);border:1px solid #dce7ff;border-radius:14px;padding:18px;margin-top:17px}.invitecard h3{margin:0 0 6px;font-size:14px}.invitecard p{margin:0 0 13px;color:#62728a;font-size:12px}.tag{display:inline-flex;align-items:center;gap:6px;background:#f2f5fa;border:1px solid #e6ebf2;border-radius:8px;padding:6px 9px;color:#596b82;font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#8290a4;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:750;padding:12px 8px;border-bottom:1px solid var(--line)}.table td{padding:14px 8px;border-bottom:1px solid #eef1f5;font-size:12px}.table tr:last-child td{border-bottom:0}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-weight:700;font-size:12px;color:#35445b}.field input,.field select{width:100%;border:1px solid #dce3ed;background:#fff;padding:12px 13px;border-radius:9px;outline:none;color:var(--ink)}.field input:focus,.field select:focus{border-color:#6b8bff;box-shadow:0 0 0 3px #3568f51a}.hint{font-size:11px;color:#8090a5;margin-top:-8px}.toast{position:fixed;right:24px;bottom:24px;background:#14243b;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:20;max-width:340px;animation:pop .2s ease}.hidden{display:none!important}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* auth */
.authscreen{min-height:100vh;display:grid;grid-template-columns:minmax(380px,.95fr) 1.05fr;background:#fff}.authleft{padding:40px 8%;display:flex;flex-direction:column;min-height:100vh}.authbrand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}.authcontent{width:100%;max-width:420px;margin:auto;padding:40px 0}.authcontent h1{font-size:31px;letter-spacing:-1px;margin:9px 0}.authcontent .sub{line-height:1.7;margin-bottom:26px}.authswitch{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}.authswitch a{color:var(--blue);font-weight:750;cursor:pointer}.authfooter{font-size:11px;color:#98a4b5;margin-top:auto}.authvisual{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 15%,#2d5485 0,transparent 34%),linear-gradient(145deg,#10203a,#172f4c 65%,#0d4b55);color:white;display:flex;align-items:center;justify-content:center;padding:9%}.visualinner{max-width:530px;position:relative;z-index:1}.visualinner .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#82ded0;font-weight:800}.visualinner h2{font-size:39px;line-height:1.12;letter-spacing:-1.4px;margin:18px 0}.visualinner p{color:#b8c9db;line-height:1.8;font-size:14px;max-width:430px}.visualpoints{display:grid;gap:14px;margin-top:34px}.visualpoint{display:flex;gap:12px;align-items:center;color:#d7e3ef;font-size:12px}.check{width:26px;height:26px;border:1px solid #45637d;border-radius:8px;display:grid;place-items:center;color:#79d9c9}.flowart{margin-top:40px;display:flex;align-items:center;gap:8px;opacity:.85}.flowbox{padding:12px 14px;border:1px solid #45627b;background:#203b56;border-radius:10px;font-size:10px;color:#dbe9f4}.flowline{height:1px;width:20px;background:#69bdb9}.demo-note{padding:12px;border-radius:9px;background:#f5f8ff;border:1px solid #e2eaff;color:#687992;font-size:11px;margin-top:16px}.auth-error{color:#c7354f;background:#fff0f2;border:1px solid #ffd5dc;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px}.auth-success{color:#137c67;background:#e8faf4;border:1px solid #c7f0e4;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px}
@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.content{padding:25px 22px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.searchmini{display:none}.authscreen{grid-template-columns:1fr}.authvisual{display:none}.authleft{padding:28px 7%;min-height:100vh}}
@media(max-width:650px){.shell{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 18px}.content{padding:22px 15px}.headingrow{flex-direction:column}.stats{gap:10px}.card{padding:15px}.stats .statnum{font-size:23px}.topright .userline>div:last-child{display:none}.authleft{padding:24px}.authcontent h1{font-size:27px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state={screen:'signin',user:null,role:'Analyst',project:'Customer Onboarding Modernisation',projects:[],invitations:[],failed:0,lockedUntil:0,users:{},questions:[],audit:[],toastTimer:null};
const roles=['Analyst','Process Owner','Technical Reviewer'];
const demoUsers=[
 {name:'Aditi Sharma',email:'aditi@example.com',password:'Process123!',role:'Analyst'},
 {name:'Rao Mehta',email:'rao@example.com',password:'Process123!',role:'Process Owner'},
 {name:'Anil Kapoor',email:'anil@example.com',password:'Process123!',role:'Technical Reviewer'}
];
demoUsers.forEach(u=>state.users[u.email]=u);
state.projects=[
 {name:'Customer Onboarding Modernisation',code:'CO',status:'In analysis',role:'Analyst',members:4,updated:'12 min ago'},
 {name:'Claims Processing Redesign',code:'CP',status:'Waiting for review',role:'Process Owner',members:6,updated:'Yesterday'},
 {name:'Supplier Risk Workflow',code:'SR',status:'Ready for approval',role:'Technical Reviewer',members:3,updated:'2 days ago'}
];
state.invitations=[{project:'Claims Processing Redesign',from:'Maya Patel',role:'Process Owner',email:'aditi@example.com'}];
function toast(msg){let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function logo(){return `<div class="authbrand"><div class="brandmark">P</div><div>ProcessFoundry AI<small style="font-size:9px;letter-spacing:1.5px;color:#8b9ab0;display:block">PROCESS INTELLIGENCE</small></div></div>`}
function authVisual(){return `<section class="authvisual"><div class="visualinner"><div class="kicker">From evidence to clarity</div><h2>Turn complex processes into clear, actionable change.</h2><p>Bring your documents, people and decisions into one workspace. ProcessFoundry AI helps teams discover how work happens today and shape what happens next.</p><div class="visualpoints"><div class="visualpoint"><span class="check">✓</span> AI-assisted process discovery and evidence review</div><div class="visualpoint"><span class="check">✓</span> Clear ownership for business and technical questions</div><div class="visualpoint"><span class="check">✓</span> Human-approved requirements and decisions</div></div><div class="flowart"><div class="flowbox">Evidence</div><div class="flowline"></div><div class="flowbox">AI discovery</div><div class="flowline"></div><div class="flowbox">Human review</div><div class="flowline"></div><div class="flowbox">Approved change</div></div></div></section>`}
function authPage(mode='signin',msg=''){
 state.screen=mode;
 let title=mode==='signup'?'Create your account':mode==='forgot'?'Password help':'Welcome back';
 let subtitle=mode==='signup'?'Set up your account to collaborate on process improvement projects.':mode==='forgot'?'Password reset is not included in this MVP. Contact your project/platform administrator for help.':'Sign in to continue to your projects and team decisions.';
 let fields=mode==='signup'?`<div class="field"><label>Display name</label><input id="displayName" placeholder="e.g. Aditi Sharma" autocomplete="name"></div><div class="field"><label>Work email</label><input id="email" type="email" placeholder="you@company.com" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div><div class="field"><label>Repeat password</label><input id="repeatPassword" type="password" placeholder="Re-enter password" autocomplete="new-password"></div>`:`<div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@company.com" autocomplete="email"></div>${mode==='signin'?`<div class="field"><div style="display:flex;justify-content:space-between;align-items:center"><label>Password</label><a style="font-size:11px;color:var(--blue);cursor:pointer" onclick="authPage('forgot')">Forgot password?</a></div><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div>`:''}`;
 document.getElementById('app').innerHTML=`<div class="authscreen"><section class="authleft">${logo()}<div class="authcontent"><div class="eyebrow">${mode==='signup'?'Get started':mode==='forgot'?'Account support':'Secure workspace'}</div><h1>${title}</h1><p class="sub">${subtitle}</p>${msg?`<div class="${msg.startsWith('SUCCESS:')?'auth-success':'auth-error'}">${msg.replace(/^SUCCESS:/,'')}</div>`:''}<form onsubmit="handleAuth(event,'${mode}')">${fields}${mode==='signin'?`<div class="hint">Your session expires after 8 hours.</div>`:''}<button class="btn btn-primary" style="width:100%;margin-top:17px;padding:12px">${mode==='signup'?'Create account':mode==='forgot'?'Return to sign in':'Sign in'} <span style="float:right">→</span></button></form>${mode==='signin'?`<div class="authswitch">New to ProcessFoundry AI? <a onclick="authPage('signup')">Create an account</a></div>`:mode==='signup'?`<div class="authswitch">Already have an account? <a onclick="authPage('signin')">Sign in</a></div>`:`<div class="authswitch"><a onclick="authPage('signin')">← Back to sign in</a></div>`}${mode==='signin'?`<div class="demo-note"><b style="color:#3b4b65">Prototype demo accounts</b><br>aditi@example.com · rao@example.com · anil@example.com<br>Password for all: <b>Process123!</b><br><span style="display:block;margin-top:5px">Demo only. Real authentication requires a secure backend.</span></div>`:''}</div><div class="authfooter">© 2026 ProcessFoundry AI · Prototype experience</div></section>${authVisual()}</div>`;
}
function handleAuth(e,mode){e.preventDefault();if(mode==='forgot'){authPage('signin','Password reset is out of scope for this MVP. Please contact your administrator.');return}
 const email=(document.getElementById('email').value||'').trim().toLowerCase(), password=document.getElementById('password').value||'';
 if(mode==='signup'){
  const name=(document.getElementById('displayName').value||'').trim(), repeat=document.getElementById('repeatPassword').value||'';
  if(!name||!email||!password||!repeat){authPage('signup','Complete all fields to continue.');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authPage('signup','Enter a valid email address.');return}
  if(state.users[email]){authPage('signup','An account with this email already exists.');return}
  if(password.length<8){authPage('signup','Password must be at least 8 characters.');return}
  if(password.toLowerCase()===email){authPage('signup','Password cannot be the same as your email.');return}
  if(password!==repeat){authPage('signup','Passwords do not match.');return}
  state.users[email]={name,email,password,role:'Analyst'};state.projects=[];state.invitations=[];state.user=state.users[email];state.audit.unshift(`${name} created an account`);myProjects();toast('Account created. Create your first project to begin.');return;
 }
 if(Date.now()<state.lockedUntil){authPage('signin','Account temporarily locked. Try again in 10 minutes.');return}
 const user=state.users[email];
 if(!user||user.password!==password){state.failed++;let message='E-mail or password is incorrect';if(state.failed>=5){state.lockedUntil=Date.now()+10*60*1000;state.failed=0;message='Account locked for 10 minutes after 5 failed attempts.'}authPage('signin',message);return}
 state.failed=0;state.user=user;state.role=user.role;state.audit.unshift(`${user.name} signed in`);myProjects();toast('Signed in successfully.');
}
function signout(){state.user=null;state.screen='signin';authPage('signin','You have signed out. Your session has been cleared.')}
function navButton(icon,label,fn,active=false){return `<button class="${active?'active':''}" onclick="${fn}"><span class="ico">${icon}</span>${label}</button>`}
function shell(content,active='projects'){let u=state.user||demoUsers[0];document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">P</div><div>ProcessFoundry AI<small>PROCESS INTELLIGENCE</small></div></div><div><div class="navlabel">Workspace</div><div class="nav">${navButton('▦','My projects','myProjects()',active==='projects')}${navButton('＋','Create a project','createProjectPage()',active==='create')}${navButton('◎','Waiting for me','waitingPage()',active==='waiting')}${navButton('♧','Team & invitations','teamPage()',active==='team')}${navButton('◷','Audit log','auditPage()',active==='audit')}</div></div><div class="sidebottom"><span class="statusdot"></span>All systems operational<br><span style="display:block;margin-top:12px">MVP prototype · Sample data</span></div></aside><main class="main"><header class="topbar"><div><div class="crumb">Workspace / <b style="color:#314159">${active==='projects'?'My projects':active==='create'?'Create project':active==='waiting'?'Waiting for me':active==='team'?'Team & invitations':active==='audit'?'Audit log':'Project overview'}</b></div></div><div class="topright"><input class="searchmini" placeholder="Search workspace…" onkeydown="if(event.key==='Enter')toast('Search is a prototype interaction.')"><div class="userline"><div class="avatar">${initials(u.name)}</div><div><b>${esc(u.name)}</b><small>${esc(state.role)} · Project role</small></div></div><button class="btn btn-secondary btn-small" onclick="signout()">Sign out</button></div></header><section class="content">${content}</section></main></div>`}
function initials(n){return (n||'U').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function myProjects(){state.screen='projects';let ps=state.projects;let content=`<div class="headingrow"><div><div class="eyebrow">Your workspace</div><h1>My projects</h1><p class="sub">A focused view of the projects and decisions you’re part of.</p></div><button class="btn btn-primary" onclick="createProjectPage()">＋ Create a project</button></div><div class="grid stats"><div class="card"><span class="staticon">▦</span><div class="statlabel">Active projects</div><div class="statnum">${ps.length}</div><div class="statnote">Projects you’re a member of</div></div><div class="card"><span class="staticon">◉</span><div class="statlabel">Waiting for you</div><div class="statnum">${state.role==='Process Owner'?2:state.role==='Technical Reviewer'?1:3}</div><div class="statnote">Questions or reviews assigned to your role</div></div><div class="card"><span class="staticon">♧</span><div class="statlabel">Pending invitations</div><div class="statnum">${state.invitations.length}</div><div class="statnote">Awaiting your response</div></div><div class="card"><span class="staticon">✓</span><div class="statlabel">Completed reviews</div><div class="statnum">12</div><div class="statnote">Across your workspace</div></div></div><div class="grid cols"><div class="card"><div class="cardhead"><h3>Recent projects</h3><span class="tag">${ps.length} projects</span></div>${ps.length?ps.map((p,i)=>`<div class="projectrow"><div class="projecticon">${esc(p.code)}</div><div class="projectinfo"><b>${esc(p.name)}</b><small>${p.members} members · Updated ${p.updated}</small></div><span class="pill ${p.status.includes('approval')?'pill-green':p.status.includes('Waiting')?'pill-amber':'pill-blue'}">${esc(p.status)}</span><button class="btn btn-secondary btn-small" onclick="openProject(${i})">Open</button></div>`).join(''):`<div class="empty"><div style="font-size:28px;margin-bottom:8px">▦</div><b style="color:var(--ink)">Your workspace starts here</b><p>Create a project or accept an invitation to get started.</p><button class="btn btn-primary" onclick="createProjectPage()">Create a project</button></div>`}</div><div><div class="card"><div class="cardhead"><h3>Recent activity</h3><span class="tag">Live demo</span></div><div class="activity">${(state.audit.length?state.audit.slice(0,4):['Process Owner approved a business rule','AI discovery completed for onboarding','Technical Reviewer commented on API design']).map((a,i)=>`<div class="activityitem"><div class="activitydot">${['✓','✦','↗'][i%3]}</div><div><b>${esc(a)}</b><small>${i===0?'Just now':i===1?'24 min ago':'Yesterday'}</small></div></div>`).join('')}</div></div><div class="invitecard"><h3>Work moves forward together</h3><p>Invite the right people to clarify business rules, review technical artifacts and approve proposed changes.</p><button class="btn btn-secondary btn-small" onclick="teamPage()">Manage team →</button></div></div></div>`;shell(content,'projects')}
function createProjectPage(){shell(`<div class="headingrow"><div><div class="eyebrow">New workspace</div><h1>Create a project</h1><p class="sub">Start a process discovery workspace and choose your role in this project.</p></div></div><div class="card" style="max-width:720px"><form onsubmit="makeProject(event)"><div class="field"><label>Project name</label><input id="projectName" required placeholder="e.g. Customer onboarding redesign"></div><div class="field"><label>Your role in this project</label><select id="projectRole">${roles.map(r=>`<option>${r}</option>`).join('')}</select><div class="hint">Roles belong to each project. You can have a different role in another project.</div></div><div class="field"><label>Project description (optional)</label><input id="projectDescription" placeholder="What process are you improving?"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-secondary" onclick="myProjects()">Cancel</button><button class="btn btn-primary">Create project →</button></div></form></div>`,'create')}
function makeProject(e){e.preventDefault();let name=document.getElementById('projectName').value.trim();let role=document.getElementById('projectRole').value;if(!name)return;state.role=role;state.user.role=role;state.projects.unshift({name,code:name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),status:'New project',role,members:1,updated:'Just now'});state.audit.unshift(`${state.user.name} created ${name} as ${role}`);myProjects();toast('Project created. Your role is '+role+'.')}
function openProject(i){let p=state.projects[i];if(!p)return;state.project=p.name;state.role=p.role||state.role;let content=`<div class="headingrow"><div><div class="eyebrow">Project overview</div><h1>${esc(p.name)}</h1><p class="sub">Discover, clarify and approve process change with a shared evidence trail.</p></div><span class="pill pill-blue">${esc(p.status)}</span></div><div class="grid stats"><div class="card"><div class="statlabel">Evidence files</div><div class="statnum">18</div><div class="statnote">Uploaded by the project team</div></div><div class="card"><div class="statlabel">Open questions</div><div class="statnum">7</div><div class="statnote">3 critical · 4 standard</div></div><div class="card"><div class="statlabel">Artifacts drafted</div><div class="statnum">6</div><div class="statnote">Generated from evidence</div></div><div class="card"><div class="statlabel">Team members</div><div class="statnum">${p.members}</div><div class="statnote">Across project roles</div></div></div><div class="grid cols"><div class="card"><div class="cardhead"><h3>Project workflow</h3><span class="tag">Human approval required</span></div><div class="projectrow"><div class="projecticon">01</div><div class="projectinfo"><b>Upload evidence</b><small>Gather SOPs, forms, spreadsheets and process documents.</small></div><button class="btn btn-secondary btn-small" onclick="toast('Upload panel opened in prototype mode.')">Upload</button></div><div class="projectrow"><div class="projecticon">02</div><div class="projectinfo"><b>AI discovery</b><small>Extract the As-Is process, identify gaps and draft artifacts.</small></div><button class="btn btn-primary btn-small" onclick="startAnalysis()">Start analysis</button></div><div class="projectrow"><div class="projecticon">03</div><div class="projectinfo"><b>Questions & clarification</b><small>Route business questions to Process Owners and technical issues to reviewers.</small></div><button class="btn btn-secondary btn-small" onclick="waitingPage()">Review questions</button></div><div class="projectrow"><div class="projecticon">04</div><div class="projectinfo"><b>Approve proposed change</b><small>Human approval is required before the To-Be process is final.</small><button class="btn btn-secondary btn-small" style="margin-top:8px" onclick="approve()">View approval</button></div></div></div><div class="card"><div class="cardhead"><h3>Project team</h3><button class="btn btn-secondary btn-small" onclick="teamPage()">Manage</button></div>${roles.map((r,i)=>`<div class="projectrow"><div class="avatar" style="width:31px;height:31px">${['AS','RM','AK'][i]}</div><div class="projectinfo"><b>${['Aditi Sharma','Rao Mehta','Anil Kapoor'][i]}</b><small>${r}</small></div>${r===state.role?'<span class="pill pill-green">You</span>':''}</div>`).join('')}<div class="invitecard"><h3>Project access is role-based</h3><p>Members see this project only after accepting an invitation.</p><button class="btn btn-secondary btn-small" onclick="teamPage()">Invite teammate →</button></div></div></div>`;shell(content,'overview')}
function startAnalysis(){if(!['Analyst','Process Owner'].includes(state.role)){toast('Only an Analyst or Process Owner can start analysis.');return}state.audit.unshift('AI analysis started for '+state.project);toast('Analysis started. Status: waiting for human clarification.');openProject(state.projects.findIndex(p=>p.name===state.project))}
function approve(){if(state.role!=='Process Owner'){toast('Only the Process Owner can approve the proposed To-Be process.');return}toast('Approval recorded in prototype mode.')}
function waitingPage(){let qs=state.role==='Process Owner'?[['Confirm refund approval threshold','Business rule','Critical'],['Clarify exception owner for failed KYC','Missing business fact','Critical']]:state.role==='Technical Reviewer'?[['Validate customer data entity mapping','Data model','Standard'],['Review retry policy in API contract','API design','Standard']]:[['Confirm source document version','Evidence quality','Standard'],['Resolve duplicate process step','Extraction issue','Critical'],['Clarify missing hand-off evidence','Evidence gap','Standard']];shell(`<div class="headingrow"><div><div class="eyebrow">Your queue</div><h1>Waiting for me</h1><p class="sub">Questions assigned to your current project role.</p></div><span class="tag">${qs.length} items</span></div><div class="card"><div class="cardhead"><h3>Assigned questions</h3><span class="tag">${state.role}</span></div>${qs.map((q,i)=>`<div class="projectrow"><div class="projecticon">${i+1}</div><div class="projectinfo"><b>${q[0]}</b><small>${q[1]} · ${state.project}</small></div><span class="pill ${q[2]==='Critical'?'pill-amber':'pill-gray'}">${q[2]}</span><button class="btn btn-primary btn-small" onclick="answerQuestion('${esc(q[0])}')">Respond</button></div>`).join('')}<p class="hint" style="margin:14px 0 0">Only questions routed to your role appear here. Project overview can show all questions as read-only.</p></div>`,'waiting')}
function answerQuestion(q){let answer=prompt('Enter your response for:\\n'+q+'\\n\\nType your answer, or enter UNKNOWN:');if(answer===null)return;state.audit.unshift(`${state.user.name} responded to: ${q}`);toast(answer.trim().toUpperCase()==='UNKNOWN'?'Marked as unknown.':'Response saved in prototype mode.')}
function teamPage(){shell(`<div class="headingrow"><div><div class="eyebrow">Collaboration</div><h1>Team & invitations</h1><p class="sub">Invite teammates to this project and manage project access.</p></div><button class="btn btn-primary" onclick="inviteForm()">＋ Invite teammate</button></div><div class="grid cols"><div class="card"><div class="cardhead"><h3>Project members</h3><span class="tag">Active</span></div>${roles.map((r,i)=>`<div class="projectrow"><div class="avatar" style="width:35px;height:35px">${['AS','RM','AK'][i]}</div><div class="projectinfo"><b>${['Aditi Sharma','Rao Mehta','Anil Kapoor'][i]}</b><small>${['aditi@example.com','rao@example.com','anil@example.com'][i]}</small></div><span class="pill ${r===state.role?'pill-green':'pill-blue'}">${r}</span></div>`).join('')}</div><div class="card"><div class="cardhead"><h3>Pending invitations</h3><span class="tag">${state.invitations.length}</span></div>${state.invitations.length?state.invitations.map((v,i)=>`<div class="projectrow"><div class="projecticon">✉</div><div class="projectinfo"><b>${esc(v.email)}</b><small>${esc(v.project)} · ${esc(v.role)}</small></div><span class="pill pill-amber">Pending</span><button class="btn btn-secondary btn-small" onclick="acceptInvite(${i})">Accept</button></div>`).join(''):`<div class="empty">No pending invitations.</div>`}<div class="hint">Invitations expire after 14 days. Invitees must use the invited email and accept before accessing project data.</div></div></div>`,'team')}
function inviteForm(){if(state.role!=='Process Owner'&&!(state.user.email==='aditi@example.com')){toast('Only the Process Owner or project creator can invite teammates.');return}let email=prompt('Teammate email address:');if(!email)return;email=email.trim().toLowerCase();let role=prompt('Assign role: Analyst, Process Owner, or Technical Reviewer','Technical Reviewer');if(!roles.includes(role)){toast('Choose one of the listed project roles.');return}state.invitations.push({project:state.project,from:state.user.name,role,email});state.audit.unshift(`${state.user.name} invited ${email} as ${role}`);teamPage();toast('Invitation created.')}
function acceptInvite(i){let inv=state.invitations[i];if(!inv)return;if(state.user.email!==inv.email){toast('Sign in with '+inv.email+' to accept this invitation.');return}state.role=inv.role;state.user.role=inv.role;state.projects.unshift({name:inv.project,code:inv.project.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),status:'Invitation accepted',role:inv.role,members:4,updated:'Just now'});state.invitations.splice(i,1);state.audit.unshift(`${state.user.name} accepted invitation to ${inv.project}`);myProjects();toast('Invitation accepted. Project access granted in prototype mode.')}
function auditPage(){shell(`<div class="headingrow"><div><div class="eyebrow">Traceability</div><h1>Audit log</h1><p class="sub">A chronological record of project actions and decisions.</p></div><button class="btn btn-secondary" onclick="toast('Audit export is not connected in this prototype.')">Export log</button></div><div class="card"><table class="table"><thead><tr><th>Event</th><th>Actor</th><th>When</th><th>Type</th></tr></thead><tbody>${(state.audit.length?state.audit:['Rao Mehta approved a business rule','AI discovery completed','Aditi Sharma uploaded onboarding SOP','Anil Kapoor reviewed API contract']).map((a,i)=>`<tr><td>${esc(a)}</td><td>${esc(state.user.name)}</td><td>${i===0?'Just now':`${i*17+8} min ago`}</td><td><span class="pill pill-blue">${i===0?'Account':'Project'}</span></td></tr>`).join('')}</tbody></table></div>`,'audit')}
authPage('signin');
</script>
</body>
</html>
