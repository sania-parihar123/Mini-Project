[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "processfoundry-ai"
version = "0.1.0"
description = "ProcessFoundry AI - Process Discovery, Redesign and Specification Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.30",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "bcrypt>=4.1.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning"
]
